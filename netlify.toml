# Netlify configuration
# ---------------------------------------------------------------------------
# Each landing page is a self-contained folder: its own index.php, build.php and
# assets/. `base` picks the one this Netlify site publishes, and `publish` is
# resolved relative to it, so "dist" means "tms/dist".
#
# A second and third landing page will live in sibling folders. Netlify builds
# one base per site, so each additional page needs either its own Netlify site
# pointed at its folder, or a root build script that renders them all into one
# dist/ under separate paths.
#
# Netlify's build image ships PHP, but the exact version varies by image. If
# the build fails with "php: command not found", either pin an image that has
# it or build locally (`php build.php`) and deploy tms/dist/ directly.

[build]
  base    = "tms"
  command = "php build.php"
  publish = "dist"

# Long-lived caching for fingerprint-free static assets. Safe here because the
# photo filenames encode their dimensions and change when the image changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"
